services:
  db:
    image: postgres:17
    restart: always
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=chaiDB
      - POSTGRES_USER=chaiurcode
      - POSTGRES_PASSWORD=chaiurcode

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080